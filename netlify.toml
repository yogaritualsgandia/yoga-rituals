[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

  # Los identificadores de medición no son secretos: viajan dentro del HTML y
  # cualquiera los puede leer. Se dejan aquí para que un despliegue no dependa
  # de que alguien se acuerde de ponerlos en el panel. `NEXT_PUBLIC_` significa
  # que Next los mete en el paquete al compilar: cambiarlos obliga a republicar.
  NEXT_PUBLIC_GA_ID = "G-QXR1789H2K"
  NEXT_PUBLIC_CLARITY_ID = "z05bd7dg6k"

  # El píxel de Meta. Falta el identificador: cuando esté, se descomenta esta
  # línea, se pone entre las comillas y se vuelve a publicar. Mientras esté
  # vacío (o comentado), no se carga nada de Meta y la web funciona igual.
  # NEXT_PUBLIC_META_PIXEL_ID = ""

  # Mientras la web solo viva en `yogaritualsweb.netlify.app`, no se indexa:
  # el dominio bueno es `www.yogarituals.es`. El generador convierte esta
  # variable en una cabecera `X-Robots-Tag: noindex` para todo el sitio.
  # QUITAR ESTA LÍNEA el día que el dominio definitivo esté activo y volver a
  # publicar; si no, el dominio bueno también saldría con noindex.
  NOINDEX = "1"

# ── Límite de peticiones ───────────────────────────────────────────────────
#
# La web es estática: no hay servidor que tumbar ni base de datos que llenar.
# Lo que sí puede pasar es que alguien pida páginas en bucle y gaste ancho de
# banda, y el ancho de banda es lo que se paga. Esto lo corta en el borde de
# Netlify, antes de que la petición llegue al sitio.
#
# Trescientas peticiones por minuto y por dirección IP es holgado para una
# persona y estrecho para un rastreador que va a mil. Con el export real, una
# visita de escritorio gasta 43 peticiones en frío y 23 por recarga —las 22 de
# más son las precargas de Next, una por cada enlace que hay en pantalla—, así
# que aguantan unas trece recargas seguidas: leer la web, holgado; machacar F5,
# no. Se probó en 900 y el aviso no llegaba nunca en el caso que importa, que es
# alguien recargando enfadado.
#
# Al pasarse, Netlify no devuelve un 429 en blanco: reescribe la petición a
# `public/demasiadas-peticiones.html`, que es un archivo suelto, sin una sola
# petición más, y explica qué ha pasado. Tiene que ser suelto: la regla corta el
# sitio entero, así que si esa página cargara estilos, fuentes o fotos, esas
# peticiones también acabarían reescritas a ella y el aviso saldría sin forma.
#
# Esa página, además, es la que mantiene el castigo: esta ventana es móvil y se
# suelta sola, así que el minuto de espera, los cinco segundos por recarga y el
# cupo que se parte en dos los lleva el navegador, con un estado que el resto
# del sitio respeta (`lib/control-recargas.ts`). Aquí solo se decide cuándo
# aparece por primera vez.
#
# No es una barrera contra un ataque distribuido: para eso está la protección
# DDoS que Netlify ya trae puesta. Esto es para el caso barato y frecuente, que
# es un solo sitio machacando. Y no sustituye al tope de gasto: en el plan
# gratuito el sitio se pausa al agotar los créditos y no genera factura.
# La regla no redirige nada: `to` apunta al mismo sitio que `from`, así que
# Netlify la usa solo como soporte del límite. Sin `status` y sin `force` a
# propósito: es la forma que documenta Netlify para proteger el sitio entero, y
# poner un 200 o un `force` aquí sí convertiría cada petición en una reescritura
# real de sí misma.
[[redirects]]
  from = "/*"
  to = "/:splat"

  [redirects.rate_limit]
    action = "rewrite"
    to = "/demasiadas-peticiones.html"
    window_limit = 300
    window_size = 60
    aggregate_by = ["ip", "domain"]